<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASSIE QC Checker — Service Integrity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.12);
    --yellow: #eab308;
    --yellow-bg: rgba(234,179,8,0.12);
    --orange: #f97316;
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
  header p { color: var(--text-muted); font-size: 0.9rem; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    margin-bottom: 1.5rem;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(59,130,246,0.05);
  }
  .upload-zone svg { margin-bottom: 1rem; }
  .upload-zone h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
  .upload-zone p { color: var(--text-muted); font-size: 0.85rem; }
  .upload-zone input { display: none; }

  .processing {
    text-align: center;
    padding: 3rem;
    display: none;
  }
  .processing .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--surface2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { display: none; }

  .shop-header {
    background: var(--surface);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    border-left: 4px solid var(--accent);
  }
  .shop-header h2 { font-size: 1.15rem; margin-bottom: 0.5rem; }
  .shop-meta { color: var(--text-muted); font-size: 0.85rem; }
  .shop-meta span { margin-right: 1.5rem; }

  .verdict {
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .verdict.pass { background: var(--green-bg); border: 1px solid var(--green); }
  .verdict.fail { background: var(--red-bg); border: 1px solid var(--red); }
  .verdict.warn { background: var(--yellow-bg); border: 1px solid var(--yellow); }
  .verdict-icon { font-size: 1.8rem; }
  .verdict h3 { font-size: 1.1rem; }
  .verdict p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.15rem; }

  .section-card {
    background: var(--surface);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .section-header {
    padding: 0.85rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .section-header:hover { background: var(--surface2); }
  .section-name { font-weight: 600; font-size: 0.95rem; }
  .section-score {
    font-size: 0.85rem;
    padding: 0.2rem 0.65rem;
    border-radius: 20px;
    font-weight: 600;
  }
  .score-good { background: var(--green-bg); color: var(--green); }
  .score-warn { background: var(--yellow-bg); color: var(--yellow); }
  .score-bad { background: var(--red-bg); color: var(--red); }

  .section-body {
    padding: 0 1.25rem 1rem;
    display: none;
  }
  .section-card.open .section-body { display: block; }

  .question-row {
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(71,85,105,0.3);
    font-size: 0.88rem;
  }
  .question-row:last-child { border-bottom: none; }
  .q-label { color: var(--text-muted); font-size: 0.8rem; }
  .q-answer { margin-top: 0.15rem; }
  .q-answer.yes { color: var(--green); }
  .q-answer.no { color: var(--red); font-weight: 600; }
  .q-comment {
    background: var(--bg);
    padding: 0.6rem 0.85rem;
    border-radius: 6px;
    margin-top: 0.35rem;
    font-size: 0.84rem;
    color: var(--text-muted);
    white-space: pre-wrap;
  }

  .issues-list { margin-bottom: 1.5rem; }
  .issue-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    border-left: 4px solid var(--red);
  }
  .issue-card.warning { border-left-color: var(--yellow); }
  .issue-card.info { border-left-color: var(--accent); background: rgba(59,130,246,0.08); }
  .issue-card.ai-issue { border-left-color: var(--purple); background: var(--purple-bg); }
  .issue-card h4 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .issue-detail { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem; }
  .issue-detail strong { color: var(--text); }

  .ai-badge {
    display: inline-block;
    background: rgba(167,139,250,0.2);
    color: var(--purple);
    font-size: 0.68rem;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.05em;
    vertical-align: middle;
    margin-left: 0.4rem;
  }
  #aiIssuesSection { margin-top: 0.25rem; }
  #aiCheckStatus {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-bottom: 0.75rem;
    font-style: italic;
  }

  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.6rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.btn:hover { background: var(--accent-hover); }
  button.btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.btn-outline:hover { background: var(--surface2); }

  .reset-bar {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--surface2);
  }

  .stats-bar {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .stat-box {
    background: var(--surface);
    border-radius: 10px;
    padding: 0.85rem 1.1rem;
    flex: 1;
    min-width: 130px;
    text-align: center;
  }
  .stat-value { font-size: 1.5rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }

  .cleaner-box {
    background: var(--surface);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-top: 1rem;
    border: 1px solid var(--surface2);
  }
  .cleaner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .cleaner-col h4 { font-size: 0.9rem; margin-bottom: 0.35rem; color: var(--text-muted); }
  .cleaner-text { background: var(--bg); border-radius: 8px; padding: 0.75rem; white-space: pre-wrap; font-size: 0.88rem; }
  .cleaner-actions { margin-top: 0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap; }
  .muted { color: var(--text-muted); font-size: 0.82rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>SASSIE QC Checker</h1>
    <p>Service Integrity — Upload a shop report PDF for consistency analysis</p>
    <p style="font-size:0.82rem;opacity:.75;">Build: 2026-03-24-rewrite-25</p>
  </header>

  <div id="uploadZone" class="upload-zone">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </svg>
    <h3>Drop SASSIE PDF here or click to upload</h3>
    <p>Print the shop review page to PDF, then upload it here</p>
    <input type="file" id="fileInput" accept=".pdf">
  </div>

  <div id="processing" class="processing">
    <div class="spinner"></div>
    <p>Parsing report and checking consistency...</p>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');
const processing = document.getElementById('processing');
const results    = document.getElementById('results');

const CLEANER_API     = window.CLEANER_API     || '/api/clean-comments';
const CONSISTENCY_API = window.CONSISTENCY_API || '/api/check-consistency';
const CONVERT_API     = window.CONVERT_API     || '/api/convert-pdf';

// ── Client rules (loaded from rules.json served by the backend) ───────────────
let clientRules = null; // null = not yet attempted

async function ensureRulesLoaded() {
  if (clientRules !== null) return;
  try {
    const res = await fetch('/rules.json');
    clientRules = res.ok ? ((await res.json()).clients || []) : [];
  } catch (_) {
    clientRules = [];
  }
}

function evaluateRule(rule, report) {
  const gc = (report.generalComment || '').toLowerCase();
  const c  = rule.conditions || {};

  if (c.comment_contains_any) {
    if (!c.comment_contains_any.some(p => gc.includes(p.toLowerCase()))) return false;
  }
  if (c.comment_contains_all) {
    if (!c.comment_contains_all.every(p => gc.includes(p.toLowerCase()))) return false;
  }
  if (c.section_score_is_zero) {
    const sn  = c.section_score_is_zero.toLowerCase();
    const sec = report.sections.find(s => s.name.toLowerCase().includes(sn));
    if (!sec || sec.scored !== 0) return false;
  }
  if (c.question_text_contains && c.answer_is) {
    const kw = c.question_text_contains.toLowerCase();
    const q  = report.questions.find(q => q.text.toLowerCase().includes(kw));
    if (!q || q.answer.toLowerCase() !== c.answer_is.toLowerCase()) return false;
  }
  return true;
}

function applyClientRules(report, issues) {
  if (!clientRules || !clientRules.length) return;
  // Detect client from survey name + first 300 chars of raw text
  const surveyText = (report.client + ' ' + report.rawText.substring(0, 300)).toLowerCase();
  for (const client of clientRules) {
    if (!surveyText.includes(client.detect.toLowerCase())) continue;
    for (const rule of (client.rules || [])) {
      if (evaluateRule(rule, report)) {
        issues.push({
          severity:     rule.severity || 'warning',
          question:     'Client Rule',
          questionText: rule.description,
          answer:       '—',
          problem:      rule.message
        });
      }
    }
  }
}

// ── AI consistency check (runs after initial render, non-blocking) ────────────
async function aiCheckConsistency(report) {
  if (!report.questions.length || !report.generalComment) return [];
  try {
    const questionsText = report.questions
      .map(q => `Q${q.number}: ${q.text} — ${q.answer} (${q.scored}/${q.total})`)
      .join('\n');
    const res = await fetch(CONSISTENCY_API, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        client:         report.client,
        questions:      questionsText,
        generalComment: report.generalComment
      })
    });
    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }
    if (!res.ok || !data || data.error) {
      const reason = (data && data.error) || `request failed (${res.status})`;
      return { unavailable: reason };
    }
    return (data.issues || []).map(i => ({
      severity:     i.severity     || 'warning',
      question:     i.question     || 'AI Check',
      questionText: i.questionText || 'Inconsistency detected',
      answer:       '—',
      problem:      i.problem      || ''
    }));
  } catch (err) {
    return { unavailable: err.message || 'request failed' };
  }
}

function appendAIIssues(result) {
  const statusEl = document.getElementById('aiCheckStatus');
  if (result && result.unavailable) {
    document.getElementById('aiIssuesSection')?.remove();
    if (statusEl) {
      const reason = String(result.unavailable);
      statusEl.textContent = /AI check unavailable/i.test(reason)
        ? reason
        : `AI check unavailable: ${reason}`;
      statusEl.style.color = 'var(--yellow)';
      statusEl.style.fontStyle = 'normal';
    }
    return;
  }

  const aiIssues = Array.isArray(result) ? result : [];
  const existing = document.getElementById('aiIssuesSection');
  if (existing) existing.remove();

  if (statusEl) {
    statusEl.textContent = aiIssues.length
      ? `AI check complete — ${aiIssues.length} additional item${aiIssues.length > 1 ? 's' : ''} flagged.`
      : 'AI check complete — no additional issues found.';
  }

  if (!aiIssues.length) return;

  let html = `<div id="aiIssuesSection">
    <h3 style="margin-bottom:0.75rem;font-size:1rem;">AI Consistency Check <span class="ai-badge">AI</span></h3>
    <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.75rem;">These are AI opinions, not confirmed errors. Use your judgement.</p>
    <div class="issues-list">`;
  for (const issue of aiIssues) {
    const cardClass = issue.severity === 'error' ? 'ai-issue' : 'ai-issue warning';
    html += `<div class="issue-card ${cardClass}">
      <h4>${escapeHtml(issue.question)}: ${escapeHtml(issue.questionText)} <span class="ai-badge">AI</span></h4>
      <div class="issue-detail"><strong>Problem:</strong> ${escapeHtml(issue.problem)}</div>
    </div>`;
  }
  html += `</div></div>`;

  const resetBar = document.querySelector('.reset-bar');
  if (resetBar) resetBar.insertAdjacentHTML('beforebegin', html);
}

// ── File processing ───────────────────────────────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });

async function processFile(file) {
  uploadZone.style.display = 'none';
  processing.style.display = 'block';
  results.style.display    = 'none';

  try {
    const arrayBuffer = await file.arrayBuffer();

    // Source A: PDF.js extraction (best chance to retain selected option markers)
    const pdf = await pdfjsLib.getDocument({
      data:          arrayBuffer,
      disableRange:  true,
      disableStream: true
    }).promise;

    let pdfText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page    = await pdf.getPage(i);
      const content = await page.getTextContent();
      pdfText += content.items.map(item => item.str).join(' ') + '\n';
    }

    // Source B: MarkItDown extraction (better structure + General Comments boundaries)
    let mdText = '';
    try {
      const conv = await fetch(CONVERT_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/pdf',
          'X-Filename': file.name || 'report.pdf'
        },
        body: arrayBuffer
      });
      if (conv.ok) {
        const data = await conv.json();
        mdText = (data && data.markdown) ? data.markdown : '';
      }
    } catch (_) {
      // Conversion optional; continue with pdfText only.
    }

    await ensureRulesLoaded();

    // Parse both sources and choose the higher-confidence parse.
    const parsedMd = mdText ? parseShopReport(mdText) : null;
    const parsedPdf = parseShopReport(pdfText);

    const scoreParse = (r) => {
      if (!r) return -1;
      const q = (r.questions || []).length;
      const s = (r.sections || []).length;
      const gc = (r.generalComment || '').length;
      return (q * 20) + (s * 2) + Math.min(gc, 600) / 30;
    };

    const parsed = (scoreParse(parsedMd) > scoreParse(parsedPdf)) ? parsedMd : parsedPdf;

    // Fill missing key fields from the alternate parse when possible.
    const alt = parsed === parsedMd ? parsedPdf : parsedMd;
    if (alt) {
      if (!parsed.client && alt.client) parsed.client = alt.client;
      if (!parsed.surveyId && alt.surveyId) parsed.surveyId = alt.surveyId;
      if (!parsed.shopRef && alt.shopRef) parsed.shopRef = alt.shopRef;
      if (!parsed.shopDate && alt.shopDate) parsed.shopDate = alt.shopDate;
      if ((!parsed.generalComment || parsed.generalComment.length < 30) && alt.generalComment) {
        parsed.generalComment = alt.generalComment;
      }
      if ((parsed.questions || []).length === 0 && (alt.questions || []).length > 0) {
        parsed.questions = alt.questions;
      }
      if ((parsed.sections || []).length === 0 && (alt.sections || []).length > 0) {
        parsed.sections = alt.sections;
      }
    }

    parsed.rawPdfText = pdfText;
    parsed.rawMdText = mdText;

    const issues = checkConsistency(parsed);
    applyClientRules(parsed, issues);

    // Render using the parse source that won confidence.
    renderResults(parsed, issues, parsed === parsedMd ? mdText : pdfText);

    // Non-blocking: comment cleaning + AI consistency check run in parallel
    if (parsed.generalComment && parsed.generalComment.trim().length > 0) {
      autoCleanGeneralComment(parsed.generalComment.trim());
    }
    aiCheckConsistency(parsed).then(aiIssues => appendAIIssues(aiIssues));

  } catch (err) {
    results.innerHTML = `<div class="verdict fail"><div class="verdict-icon">&#9888;</div><div><h3>Error parsing PDF</h3><p>${err.message}. Make sure this is a SASSIE shop review PDF printed via File &rarr; Print &rarr; Save as PDF.</p></div></div>`;
    results.style.display = 'block';
  }
  processing.style.display = 'none';
}

// ── Report parser ─────────────────────────────────────────────────────────────
function parseShopReport(text) {
  const report = {
    shopRef: '', client: '', surveyId: '', location: '', shopDate: '', shopper: '',
    overallScore: 0, sections: [], questions: [], generalComment: '', rawText: text
  };

  const refMatch = text.match(/Shop Ref#:\s*(\d+)/i);
  if (refMatch) report.shopRef = refMatch[1];

  const dateMatch = text.match(/Shop Date:\s*([\d\/\-]+)/i);
  if (dateMatch) report.shopDate = dateMatch[1];

  const shopperMatch = text.match(/Shopper\s*#\d+:\s*([A-Za-z\s]+?)(?:\s*Shopper Phone|$)/i);
  if (shopperMatch) report.shopper = shopperMatch[1].trim();

  // Authoritative header form (line 2 in Admin PDF): "Client: Survey ID"
  const line2Match = text.match(/\b([A-Za-z][A-Za-z\s&']+?)\s*:\s*([A-Za-z0-9\s\/\-]+20\d{2}(?:\/20\d{2})?)\b/i);
  if (line2Match) {
    report.client = line2Match[1].trim();
    report.surveyId = line2Match[2].trim();
  } else {
    const titleMatch = text.match(/([A-Za-z\s&']+(?:Store|Shop|Visit|Mystery|Audit|Survey|Assessment)[^\n]*\d{4})/i);
    if (titleMatch) report.client = titleMatch[1].trim();
  }

  const locationMatch = text.match(/Location:\s*([^\n(]+)/i);
  if (locationMatch) report.location = locationMatch[1].trim();

  const overallMatch = text.match(/(\d+)%\s*:?\s*Overall\s*Score/i) || text.match(/Overall\s*Score[^0-9]*(\d+)%/i);
  if (overallMatch) report.overallScore = parseInt(overallMatch[1]);

  const sectionScoreRegex = /(\d+)%\s*:?\s*([\dA-Za-z\s&]+?)\s*\((\d+)\/(\d+)\)/g;
  let match;
  while ((match = sectionScoreRegex.exec(text)) !== null) {
    const name = match[2].trim();
    if (name.toLowerCase() !== 'overall score') {
      report.sections.push({ name, percentage: parseInt(match[1]), scored: parseInt(match[3]), total: parseInt(match[4]) });
    }
  }

  const qRegex = /(?:^|\s)(\d{1,3}[a-z]?)[\.\)]\s+([A-Z][^?]*\?)\s+(\d+)\/(\d+)\s+Yes\s+No/g;
  while ((match = qRegex.exec(text)) !== null) {
    const qNum = match[1];
    if (parseInt(qNum) > 200) continue;
    const scored = parseInt(match[3]), total = parseInt(match[4]);
    const answer = scored === total ? 'Yes' : scored === 0 ? 'No' : 'Partial';
    if (!report.questions.find(q => q.number === qNum)) {
      report.questions.push({ number: qNum, text: match[2].trim(), scored, total, answer, comment: '' });
    }
  }

  const qRegexNA = /(?:^|\s)(\d{1,3}[a-z]?)[\.\)]\s+([A-Z][^?]*\?)\s+(\d+)\/(\d+)\s+Yes\s+No\s+N\/A/g;
  while ((match = qRegexNA.exec(text)) !== null) {
    const qNum = match[1];
    if (!report.questions.find(q => q.number === qNum)) {
      const scored = parseInt(match[3]), total = parseInt(match[4]);
      report.questions.push({ number: qNum, text: match[2].trim(), scored, total, answer: scored === total ? 'Yes' : scored === 0 ? 'No' : 'Partial', comment: '' });
    }
  }

  // ── Extract General Comment ──
  const terminators = [
    /\b[A-Z]{2,3}\s+\d{1,2}\/\d{1,2}\b/,
    /Spell\s*Check/i, /QC\s*Notes/i, /Dear\s+[A-Z]/,
    /This email is from/i, /Thank you for submitting/i, /UPDATE\s+SURVEY/i
  ];
  function trimToTerminator(str) {
    let end = str.length;
    for (const term of terminators) { const m = str.match(term); if (m && m.index < end) end = m.index; }
    return str.substring(0, end).trim();
  }

  // Strict General Comments boundary: capture only text between "General Comments" and "QC Notes".
  const gcStrict = text.match(/\bGeneral\s+Comments?\b([\s\S]*?)(?=\bQC\s*Notes\b|\bUPDATE\s+SURVEY\b|\bCURRENT\s+FONT\s+SIZE\b|\bREVIEWER\s+CONTROLS\b|$)/i);
  if (gcStrict && gcStrict[1]) {
    let block = gcStrict[1].replace(/^[:\-\s]+/, '').trim();

    // Preferred split: everything after the instruction sentence.
    const afterInstruction = block.split(/Please\s+focus\s+on\s+the\s+brand\s+recommendations\.?/i).slice(1).join(' ').trim();
    if (afterInstruction) block = afterInstruction;

    // Remove known UI/instruction noise that appears before/around textarea content.
    block = block
      .replace(/You\s+MUST\s+answer[\s\S]*?evaluation\.?/ig, ' ')
      .replace(/Please\s+focus\s+on\s+the\s+brand\s+recommendations\.?/ig, ' ')
      .replace(/\bSpell\s*Check\b/ig, ' ')
      .replace(/\bGeneral\s+Comments?\b/ig, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    // Keep only narrative-like content, not labels.
    const sentences = block.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
    const narrative = sentences.filter(s => /[a-z]{3,}/i.test(s) && s.length > 35 && !/^(yes|no|question|score|answer)$/i.test(s));
    const commentText = (narrative.join(' ').trim() || block).trim();

    if (commentText.length > 20) report.generalComment = commentText;
  }

  // Fallback: some exports place narrative after instruction outside captured block.
  if (!report.generalComment) {
    const afterFocus = text.match(/Please\s+focus\s+on\s+the\s+brand\s+recommendations\.?([\s\S]*?)(?=\bQC\s*Notes\b|\bUPDATE\s+SURVEY\b|\bCURRENT\s+FONT\s+SIZE\b|\bREVIEWER\s+CONTROLS\b|$)/i);
    if (afterFocus && afterFocus[1]) {
      const candidate = afterFocus[1]
        .replace(/\bSpell\s*Check\b/ig, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (candidate.length > 20) report.generalComment = candidate;
    }
  }

  // Controlled fallback only (avoid random narrative contamination)
  if (!report.generalComment) {
    const lastUpdateIdx = text.lastIndexOf('UPDATE SURVEY');
    if (lastUpdateIdx >= 0) {
      const candidate = trimToTerminator(text.substring(lastUpdateIdx + 'UPDATE SURVEY'.length).trim());
      if (candidate.length > 10) report.generalComment = candidate;
    }
  }

  return report;
}

// ── Consistency checks (algorithm) ───────────────────────────────────────────
function checkConsistency(report) {
  const issues = [];
  const gc = (report.generalComment || '').toLowerCase();
  const gcWordCount = gc.split(/\s+/).filter(w => w.length > 0).length;
  const noAnswers  = report.questions.filter(q => q.answer === 'No');
  const yesAnswers = report.questions.filter(q => q.answer === 'Yes');

  const contradictionMap = [
    { keywords: ['badge', 'name badge', 'name tag', 'nametag'],           topics: ['badge', 'name badge', 'dressed', 'uniform', 'appearance'] },
    { keywords: ['greeted', 'greeting', 'welcomed', 'acknowledged'],       topics: ['greet', 'welcome', 'acknowledg'] },
    { keywords: ['clean', 'tidy', 'presentable', 'well-maintained'],       topics: ['clean', 'tidy', 'presentab', 'exterior'] },
    { keywords: ['approached', 'came up to', 'came over'],                 topics: ['approach', 'came up', 'came over'] },
    { keywords: ['professional', 'dressed well', 'well-dressed', 'uniform'], topics: ['dress', 'professional', 'uniform', 'appearance'] },
    { keywords: ['quote', 'pricing', 'price'],                             topics: ['quote', 'pricing', 'price'] },
    { keywords: ['farewell', 'goodbye', 'parting'],                        topics: ['farewell', 'goodbye', 'parting'] },
    { keywords: ['features', 'benefits', 'demonstrated'],                  topics: ['feature', 'benefit', 'demonstrat'] },
    { keywords: ['additional products', 'add-on', 'addon', 'upsell', 'suggested additional'], topics: ['additional', 'add-on', 'addon', 'upsell', 'enhance the sale'] },
    { keywords: ['objection', 'concern', 'handled'],                       topics: ['objection', 'concern', 'handled'] },
    { keywords: ['music', 'playing'],                                      topics: ['music'] },
    { keywords: ['promotional', 'banner', 'poster', 'display'],            topics: ['promoti', 'banner', 'poster'] },
    { keywords: ['call back', 'follow up', 'callback'],                    topics: ['call back', 'follow up', 'follow-up'] },
    { keywords: ['online portal', 'convert online'],                       topics: ['portal', 'online'] },
    { keywords: ['commitment', 'purchase today', 'close', 'closing'],      topics: ['commit', 'purchase today', 'closing'] },
  ];

  function extractSnippet(text, keyword, contextChars = 60) {
    const idx = text.toLowerCase().indexOf(keyword.toLowerCase());
    if (idx === -1) return null;
    const sentenceStart = Math.max(0, text.lastIndexOf('.', idx) + 1);
    const sentenceEnd   = text.indexOf('.', idx + keyword.length);
    const start = sentenceStart > 0 ? sentenceStart : Math.max(0, idx - contextChars);
    const end   = sentenceEnd   > 0 ? Math.min(text.length, sentenceEnd + 1) : Math.min(text.length, idx + keyword.length + contextChars);
    return text.substring(start, end).trim();
  }

  for (const q of noAnswers) {
    const qTextLower = q.text.toLowerCase();
    for (const mapping of contradictionMap) {
      if (!mapping.topics.some(t => qTextLower.includes(t))) continue;
      const matchedKeyword = mapping.keywords.find(k => gc.includes(k.toLowerCase()));
      if (matchedKeyword) {
        const snippet   = extractSnippet(report.generalComment || '', matchedKeyword);
        const quotePart = snippet ? `\n\nThe General Summary says: "${snippet}"` : '';
        issues.push({ severity: 'error', question: `Q${q.number}`, questionText: q.text, answer: `No — ${q.scored}/${q.total}`, problem: `The binary answer is "No" (${q.scored}/${q.total}) but the General Summary claims otherwise.${quotePart}` });
      }
    }
  }

  for (const q of yesAnswers) {
    const qTextLower = q.text.toLowerCase();
    for (const mapping of contradictionMap) {
      if (!mapping.topics.some(t => qTextLower.includes(t))) continue;
      const negPatterns = mapping.keywords.map(k => `no ${k}|didn't ${k}|did not ${k}|wasn't ${k}|without ${k}|not ${k}|never ${k}|failed to ${k}`);
      const negMatch = gc.match(new RegExp(`(${negPatterns.join('|')})`, 'i'));
      if (negMatch) {
        const snippet   = extractSnippet(report.generalComment || '', negMatch[0]);
        const quotePart = snippet ? `\n\nThe General Summary says: "${snippet}"` : '';
        issues.push({ severity: 'error', question: `Q${q.number}`, questionText: q.text, answer: `Yes — ${q.scored}/${q.total}`, problem: `The binary answer is "Yes" (full marks) but the General Summary describes a negative experience in this area.${quotePart}` });
      }
    }
  }

  const looksLikeInstructionOnly = /^please\s+focus\s+on\s+the\s+brand\s+recommendations\.?$/i.test((report.generalComment || '').trim());

  if (report.questions.length === 0) {
    issues.push({
      severity: 'warning',
      question: 'Parse Quality',
      questionText: 'Questions not parsed',
      answer: '0 questions parsed',
      problem: 'Could not reliably parse question/answer blocks from this PDF. Route to manual review; do not treat as deterministic inconsistency.'
    });
  } else if (gcWordCount > 0 && gcWordCount < 30 && !looksLikeInstructionOnly) {
    issues.push({ severity: 'error', question: 'General Summary', questionText: 'Summary is too brief', answer: `${gcWordCount} words`, problem: `The General Summary is only ${gcWordCount} words. For a shop with ${report.questions.length} questions, this needs significantly more detail.` });
  } else if (gcWordCount >= 30 && gcWordCount < 60 && !looksLikeInstructionOnly) {
    issues.push({ severity: 'warning', question: 'General Summary', questionText: 'Summary may be too brief', answer: `${gcWordCount} words`, problem: `The General Summary is only ${gcWordCount} words. Consider whether this provides enough context for the client.` });
  } else if (gcWordCount === 0 || looksLikeInstructionOnly) {
    issues.push({ severity: 'warning', question: 'General Summary', questionText: 'No usable shopper comment detected', answer: 'Missing/Instruction-only', problem: `Could not find usable shopper General Comments text. This may be a parsing issue; route to manual review.` });
  }

  const aiPhrases = [
    'overall experience was very positive','overall experience was positive','pleasant and welcoming atmosphere',
    'communicated clearly throughout','making the shopping experience comfortable','handled this well by explaining',
    'professional manner throughout','my overall experience at','the staff member greeted me promptly',
    'was attentive and communicated','comfortable and enjoyable','comfortable and premium environment',
    'creating a comfortable and premium','felt very pleasant and welcoming','making every effort to ensure',
    'overall, the visit was','the shopping experience was both','a positive and memorable experience',
    'courteous and professional','in a friendly and professional manner','was very helpful and knowledgeable',
    'took the time to explain','went above and beyond','i was thoroughly impressed',
    'the entire experience was seamless','a warm and inviting atmosphere','exceeded my expectations',
    'demonstrated excellent knowledge','provided exceptional service','ensured that i felt valued',
    'i felt valued as a customer','conducted themselves in a professional','maintaining a high standard',
    'enhanced the overall experience'
  ];
  const detectedAI = aiPhrases.filter(p => gc.includes(p.toLowerCase()));
  if (detectedAI.length >= 3) {
    issues.push({ severity: 'error', question: 'General Summary', questionText: 'AI-generated language detected', answer: `${detectedAI.length} AI phrases found`, problem: `The General Summary contains ${detectedAI.length} phrases commonly produced by ChatGPT/AI tools: "${detectedAI.slice(0,3).join('", "')}"${detectedAI.length > 3 ? ', and more' : ''}.` });
  } else if (detectedAI.length === 2) {
    issues.push({ severity: 'warning', question: 'General Summary', questionText: 'Possible AI-generated language', answer: `2 AI phrases found`, problem: `Found phrases commonly produced by AI: "${detectedAI.join('", "')}". Worth checking.` });
  } else if (detectedAI.length === 1) {
    issues.push({ severity: 'warning', question: 'General Summary', questionText: 'Possible AI-generated language', answer: '1 AI phrase found', problem: `Found a phrase commonly produced by AI: "${detectedAI[0]}". Might be fine on its own.` });
  }

  checkPaintRecommendations(report, issues);
  return issues;
}

// ── Paint recommendation checks ───────────────────────────────────────────────
function checkPaintRecommendations(report, issues) {
  const fullText = report.rawPdfText || report.rawText || '';
  const clientScope = `${report.client || ''} ${report.surveyId || ''} ${fullText.slice(0, 300)}`;
  if (!/paint\s*shop|paint\s*20\d{2}/i.test(clientScope)) return;

  if ((report.questions || []).length === 0) {
    issues.push({
      severity: 'warning',
      question: 'Paint Parse Confidence',
      questionText: 'Insufficient parse for deterministic Paint checks',
      answer: 'Questions parsed: 0',
      problem: 'Cannot reliably compare Q3/Q6 against General Comments from this extraction. Route to manual/AI review.'
    });
    return;
  }

  const marker = /[✓✔✅☑✓✔☑✅-]/;
  const options = [
    { code: 'a', brand: 'ACCENT', rx: /accent/i },
    { code: 'b', brand: 'BRITISH_PAINTS', rx: /british\s*paints?/i },
    { code: 'c', brand: 'DULUX', rx: /dulux/i },
    { code: 'd', brand: 'TAUBMANS_ENDURE', rx: /taubmans\s*endure(?!\s*\/)/i },
    { code: 'e', brand: 'TAUBMANS_EASY_COAT', rx: /taubmans\s*easy\s*coat/i },
    { code: 'f', brand: 'TAUBMANS_ENDURE_ALL_WEATHER', rx: /taubmans\s*endure\s*\/\s*all\s*weather/i },
    { code: 'g', brand: 'TAUBMANS_SUNPROOF', rx: /taubmans\s*sunproof/i },
    { code: 'h', brand: 'WATTYL_ID', rx: /wattyl\s*id/i },
    { code: 'i', brand: 'WATTYL_SOLAGARD', rx: /wattyl\s*solagard/i },
    { code: 'j', brand: 'OTHER_WATTYL', rx: /other\s+wattyl/i },
    { code: 'k', brand: 'OTHER_TAUBMANS', rx: /other\s+taubmans/i },
    { code: 'l', brand: 'PORTERS', rx: /porters/i }
  ];

  const normalizeMention = (txt) => {
    if (!txt) return null;
    const t = String(txt);
    for (const o of options) if (o.rx.test(t)) return o.brand;
    return null;
  };

  const extractQuestionBlock = (qNo, nextNo) => {
    const rx = new RegExp(`${qNo}\.\s*What\s+brand[\s\S]*?(?=${qNo}a\.|${nextNo}\.)`, 'i');
    const m = fullText.match(rx);
    return m ? m[0] : '';
  };

  const selectedFromBlock = (block) => {
    if (!block) return null;
    for (const o of options) {
      const after = new RegExp(`\b${o.code}\.\s*[\s\S]{0,220}?${o.rx.source}[\s\S]{0,60}?${marker.source}`, 'i');
      const before = new RegExp(`${marker.source}[\s\S]{0,80}?\b${o.code}\.\s*[\s\S]{0,220}?${o.rx.source}`, 'i');
      if (after.test(block) || before.test(block)) return o.brand;
    }
    return null;
  };

  const q3 = extractQuestionBlock(3, 4);
  const q6 = extractQuestionBlock(6, 7);
  const firstSelected = selectedFromBlock(q3);
  const secondSelected = selectedFromBlock(q6);

  const gc = report.generalComment || '';
  if (!gc) return;

  const firstSentence = (gc.match(/(?:first\s+recommend(?:ed|ation)?|inside\s+paint\s+recommendation|best\s+paint\s+recommendation)[^.!?]{0,400}/i) || [])[0] || '';
  const secondSentence = (gc.match(/(?:second\s+best\s+recommendation|second\s+recommend(?:ed|ation)?|2nd\s+recommend(?:ed|ation)?|alternative\/2nd\s+recommendation|alternative\s+recommendation)[^.!?]{0,400}/i) || [])[0] || '';

  const firstMention = normalizeMention(firstSentence);
  const secondMention = normalizeMention(secondSentence);

  if (firstMention && firstSelected && firstMention !== firstSelected) {
    issues.push({
      severity: 'error',
      question: 'Q3 vs General Comments',
      questionText: 'First recommendation mismatch',
      answer: `Q3 selected: ${firstSelected}`,
      problem: `General Comments first recommendation says ${firstMention}.`
    });
  }

  if (secondMention && secondSelected && secondMention !== secondSelected) {
    issues.push({
      severity: 'error',
      question: 'Q6 vs General Comments',
      questionText: 'Second recommendation mismatch',
      answer: `Q6 selected: ${secondSelected}`,
      problem: `General Comments second recommendation says ${secondMention}.`
    });
  }

  if ((firstMention && !firstSelected) || (secondMention && !secondSelected)) {
    issues.push({
      severity: 'warning',
      question: 'Paint Parse Confidence',
      questionText: 'Could not reliably detect selected Q3/Q6 option(s)',
      answer: `Q3=${firstSelected || '?'}, Q6=${secondSelected || '?'}`,
      problem: 'Comments contain first/second recommendation claims but option ticks were not confidently extracted.'
    });
  }
}

// ── Debug panel — reveals what PDF.js actually extracted ─────────────────────
function buildDebugPanel(rawText) {
  // Collect unique non-ASCII characters with one example context each
  const seen = new Map();
  for (let i = 0; i < rawText.length; i++) {
    const code = rawText.charCodeAt(i);
    if (code > 127 && !seen.has(code)) {
      const ctx = rawText.substring(Math.max(0, i - 25), i + 26).replace(/\n/g, '\u21b5');
      seen.set(code, { char: rawText[i], hex: code.toString(16).toUpperCase().padStart(4, '0'), ctx });
    }
  }

  // Pull out lines in and around the Recommendation sections
  const lines = rawText.split('\n');
  const recLines = [];
  let capturing = false;
  for (let i = 0; i < lines.length; i++) {
    if (/First\s+Recommendation|Second\s+Recommendation/i.test(lines[i])) capturing = true;
    if (capturing) {
      recLines.push({ n: i + 1, t: lines[i] });
      if (recLines.length >= 50) break;
    }
  }

  let h = `<div style="margin-top:1.5rem;border-top:1px solid var(--surface2);padding-top:1rem;">
    <button class="btn btn-outline" style="font-size:0.78rem;padding:0.3rem 0.75rem;opacity:0.55;"
      onclick="var p=this.nextElementSibling;p.style.display=p.style.display==='none'?'block':'none'">
      &#128030; Debug: PDF text extraction
    </button>
    <div style="display:none;margin-top:0.75rem;">`;

  // Non-ASCII character table
  h += `<div style="background:var(--surface);border-radius:8px;padding:0.85rem 1rem;margin-bottom:0.75rem;">
    <h4 style="font-size:0.85rem;margin-bottom:0.5rem;color:var(--text-muted);">Non-ASCII characters extracted (${seen.size} unique)</h4>`;
  if (seen.size === 0) {
    h += `<p style="font-size:0.82rem;color:var(--yellow);">&#9888; Zero non-ASCII characters found. PDF.js is stripping or mapping all special glyphs to ASCII — ticked checkboxes may be lost completely. The raw lines below will show what appears near brand names.</p>`;
  } else {
    h += `<table style="font-size:0.78rem;border-collapse:collapse;width:100%;font-family:monospace;">
      <tr style="color:var(--text-muted);font-size:0.72rem;"><th style="text-align:left;padding:0.2rem 0.4rem;">U+</th><th style="padding:0.2rem 0.4rem;">Char</th><th style="text-align:left;padding:0.2rem 0.4rem;">Context</th></tr>`;
    for (const [, { char, hex, ctx }] of seen) {
      h += `<tr style="border-top:1px solid var(--surface2);">
        <td style="padding:0.25rem 0.4rem;color:var(--accent);">U+${hex}</td>
        <td style="padding:0.25rem 0.4rem;font-size:1.1rem;text-align:center;">${escapeHtml(char)}</td>
        <td style="padding:0.25rem 0.4rem;color:var(--text-muted);font-size:0.72rem;">${escapeHtml(ctx)}</td>
      </tr>`;
    }
    h += `</table>`;
  }
  h += `</div>`;

  // Recommendation section raw lines
  if (recLines.length > 0) {
    h += `<div style="background:var(--surface);border-radius:8px;padding:0.85rem 1rem;margin-bottom:0.75rem;">
      <h4 style="font-size:0.85rem;margin-bottom:0.5rem;color:var(--text-muted);">Raw lines in Recommendation section (look for tick characters)</h4>
      <pre style="font-size:0.75rem;white-space:pre-wrap;color:var(--text-muted);max-height:220px;overflow-y:auto;">`;
    for (const { n, t } of recLines) {
      h += escapeHtml(`${String(n).padStart(4,' ')}: ${t}`) + '\n';
    }
    h += `</pre></div>`;
  }

  // Full raw text dump
  h += `<div style="background:var(--surface);border-radius:8px;padding:0.85rem 1rem;">
    <h4 style="font-size:0.85rem;margin-bottom:0.5rem;color:var(--text-muted);">Full raw extracted text (first 4000 chars)</h4>
    <pre style="font-size:0.72rem;white-space:pre-wrap;color:var(--text-muted);max-height:320px;overflow-y:auto;">${escapeHtml(rawText.substring(0, 4000))}</pre>
  </div>`;

  h += `</div></div>`;
  return h;
}

// ── Render results ────────────────────────────────────────────────────────────
function renderResults(report, issues, rawText) {
  const errors   = issues.filter(i => i.severity === 'error');
  const warnings = issues.filter(i => i.severity === 'warning');

  let verdictClass, verdictIcon, verdictTitle, verdictDesc;
  if (errors.length === 0 && warnings.length === 0) {
    verdictClass = 'pass'; verdictIcon = '&#10004;';
    verdictTitle = 'CONSISTENT — Ready for review';
    verdictDesc  = 'No major mismatches detected between answers and comments.';
  } else if (errors.length === 0) {
    verdictClass = 'warn'; verdictIcon = '&#9888;';
    verdictTitle = `REVIEW NEEDED — ${warnings.length} item${warnings.length > 1 ? 's' : ''} to check`;
    verdictDesc  = 'Potential ambiguity/parse confidence issue detected. Do not treat as clean pass until reviewed.';
  } else {
    verdictClass = 'fail'; verdictIcon = '&#10008;';
    verdictTitle = `INCONSISTENT — ${errors.length} mismatch${errors.length > 1 ? 'es' : ''} found`;
    verdictDesc  = 'Comments do not match answers. Fix before finalising.';
  }

  let html = '';

  html += `<div class="shop-header">
    <h2>${report.client || 'Shop Report'}</h2>
    <div class="shop-meta">
      ${report.shopRef  ? `<span>Ref# ${report.shopRef}</span>` : ''}
      ${report.shopper  ? `<span>Shopper: ${report.shopper}</span>` : ''}
      ${report.shopDate ? `<span>Date: ${report.shopDate}</span>` : ''}
    </div>
  </div>`;

  html += `<div class="stats-bar">
    <div class="stat-box">
      <div class="stat-value" style="color:${report.overallScore >= 80 ? 'var(--green)' : report.overallScore >= 60 ? 'var(--yellow)' : 'var(--red)'}">${report.overallScore || '—'}%</div>
      <div class="stat-label">Overall Score</div>
    </div>
    <div class="stat-box"><div class="stat-value">${report.sections.length}</div><div class="stat-label">Sections</div></div>
    <div class="stat-box"><div class="stat-value">${report.questions.length}</div><div class="stat-label">Questions Parsed</div></div>
    <div class="stat-box">
      <div class="stat-value" style="color:${errors.length > 0 ? 'var(--red)' : 'var(--green)'}">${errors.length}</div>
      <div class="stat-label">Mismatches</div>
    </div>
  </div>`;

  html += `<div class="verdict ${verdictClass}">
    <div class="verdict-icon">${verdictIcon}</div>
    <div><h3>${verdictTitle}</h3><p>${verdictDesc}</p></div>
  </div>`;

  if (issues.length > 0) {
    html += `<h3 style="margin-bottom:0.75rem;font-size:1rem;">Issues Found</h3><div class="issues-list">`;
    for (const issue of issues) {
      const cardClass = issue.severity === 'error' ? '' : issue.severity === 'info' ? 'info' : 'warning';
      html += `<div class="issue-card ${cardClass}">
        <h4>${escapeHtml(issue.question)}: ${escapeHtml(issue.questionText)}</h4>
        <div class="issue-detail"><strong>Detail:</strong> ${escapeHtml(issue.answer)}</div>
        <div class="issue-detail"><strong>Problem:</strong> ${escapeHtml(issue.problem)}</div>
      </div>`;
    }
    html += `</div>`;
  }

  // AI check placeholder — filled in by appendAIIssues()
  html += `<h3 style="margin:1.5rem 0 0.5rem;font-size:1rem;">AI Consistency Check <span class="ai-badge">AI</span></h3>
  <p id="aiCheckStatus" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.75rem;font-style:italic;">Running AI check&hellip;</p>`;

  if (report.generalComment) {
    const preview = report.generalComment.substring(0, 3000);
    html += `<h3 style="margin:1.5rem 0 0.75rem;font-size:1rem;">General Summary (Original + Cleaned)</h3>
    <div id="cleanerBox" class="cleaner-box">
      <div class="cleaner-grid">
        <div class="cleaner-col">
          <h4>Original</h4>
          <div id="originalComment" class="cleaner-text">${escapeHtml(preview)}${report.generalComment.length > 3000 ? '...' : ''}</div>
          <div class="cleaner-actions"><button class="btn btn-outline" onclick="copyTextById('originalComment')">Copy original</button></div>
        </div>
        <div class="cleaner-col">
          <h4>Cleaned</h4>
          <div id="cleanedComment" class="cleaner-text">Preparing cleaned version&hellip;</div>
          <div class="cleaner-actions">
            <button id="copyCleanedBtn" class="btn" onclick="copyTextById('cleanedComment')" disabled>Copy cleaned for SASSIE</button>
          </div>
        </div>
      </div>
      <div id="cleanerStatus" class="muted" style="margin-top:0.6rem;">Waiting&hellip;</div>
    </div>`;
  }

  html += buildDebugPanel(rawText);

  html += `<div class="reset-bar"><button class="btn btn-outline" onclick="resetApp()">Check Another Report</button></div>`;

  results.innerHTML = html;
  results.style.display = 'block';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

async function autoCleanGeneralComment(originalComment) {
  const box    = document.getElementById('cleanerBox');
  if (!box) return;
  const status    = document.getElementById('cleanerStatus');
  const cleanedEl = document.getElementById('cleanedComment');
  const copyBtn   = document.getElementById('copyCleanedBtn');
  status.textContent = 'Cleaning comment with AI\u2026';
  try {
    const res = await fetch(CLEANER_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ comment: originalComment }) });
    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }
    if (!res.ok || !data || data.error || !data.cleaned) {
      const reason = (data && data.error) || `Cleaner API error (${res.status})`;
      throw new Error(reason);
    }
    cleanedEl.textContent = data.cleaned;
    status.textContent = 'Cleaned automatically. Review then copy into SASSIE.';
    copyBtn.disabled = false;
  } catch (e) {
    cleanedEl.textContent = originalComment;
    status.textContent = `Cleaner unavailable: ${e.message || 'request failed'}. Showing original text.`;
    copyBtn.disabled = false;
  }
}

function copyTextById(id) {
  navigator.clipboard.writeText(document.getElementById(id)?.textContent || '');
}

function resetApp() {
  uploadZone.style.display = 'block';
  results.style.display    = 'none';
  results.innerHTML        = '';
  fileInput.value          = '';
}
</script>
</body>
